function fill(){
  req(()=>{
    const ids = players.map(p=>p.id);
    const h = id => players.find(p=>p.id===id)?.hcp || 0;
    const pairKey = (a,b) => [a,b].sort().join("|");
    const shuffle = arr => {
      const a=[...arr];
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    };
    const teamTotal = team => team.reduce((s,id)=>s+h(id),0);
    const range = teams => {
      const totals = teams.map(teamTotal);
      return Math.max(...totals) - Math.min(...totals);
    };
    const pairsForTeam = team => {
      const pairs=[];
      for(let i=0;i<team.length;i++){
        for(let j=i+1;j<team.length;j++) pairs.push(pairKey(team[i],team[j]));
      }
      return pairs;
    };
    const addUsedPairs = (teams, used) => {
      teams.forEach(team => pairsForTeam(team).forEach(p => used.add(p)));
    };
    const repeatCount = (teams, used) => {
      let count=0;
      teams.forEach(team => pairsForTeam(team).forEach(p => { if(used.has(p)) count++; }));
      return count;
    };

    // Builds teams by snake draft from handicap tiers.
    // This creates fairness, but because each tier is shuffled, every click should look different.
    const makeFourManTeams = (usedPairs) => {
      const sorted = [...ids].sort((a,b)=>h(a)-h(b));
      const tiers = [
        shuffle(sorted.slice(0,3)),
        shuffle(sorted.slice(3,6)),
        shuffle(sorted.slice(6,9)),
        shuffle(sorted.slice(9,12))
      ];

      let candidates=[];
      for(let attempt=0;attempt<160;attempt++){
        const localTiers = tiers.map(t => shuffle(t));
        const teams = [[],[],[]];
        localTiers.forEach((tier, tierIdx)=>{
          const order = tierIdx % 2 === 0 ? [0,1,2] : [2,1,0];
          order.forEach((teamIdx, i)=>teams[teamIdx].push(tier[i]));
        });
        // Randomly rotate players between same-tier slots sometimes.
        if(Math.random() > 0.5) teams.reverse();
        const score = range(teams) + repeatCount(teams, usedPairs)*3 + Math.random()*5;
        candidates.push({teams, score});
      }
      candidates.sort((a,b)=>a.score-b.score);
      const top = candidates.slice(0,20);
      const chosen = top[Math.floor(Math.random()*top.length)].teams;
      addUsedPairs(chosen, usedPairs);
      return chosen;
    };

    const makePairs = (usedPairs) => {
      const sorted = [...ids].sort((a,b)=>h(a)-h(b));
      let candidates=[];
      for(let attempt=0;attempt<240;attempt++){
        const low = shuffle(sorted.slice(0,6));
        const high = shuffle(sorted.slice(6,12));
        const pairs = low.map((id,i)=>[id, high[i]]);
        if(Math.random() > 0.5) pairs.reverse();
        const totals = pairs.map(teamTotal);
        const spread = Math.max(...totals) - Math.min(...totals);
        const repeats = repeatCount(pairs, usedPairs);
        candidates.push({pairs, score: spread + repeats*4 + Math.random()*6});
      }
      candidates.sort((a,b)=>a.score-b.score);
      const top = candidates.slice(0,30);
      const chosen = top[Math.floor(Math.random()*top.length)].pairs;
      addUsedPairs(chosen, usedPairs);
      return chosen;
    };

    const usedPairs = new Set();

    const fri = makeFourManTeams(usedPairs);

    // Saturday AM should stay inside normal golf foursomes.
    // Build 3 balanced foursomes, then rotate partners inside each foursome:
    // A+B vs C+D, A+C vs B+D, A+D vs B+C.
    const satAmFoursomes = makeFourManTeams(usedPairs);
    const sat1 = satAmFoursomes.flatMap(g => [[g[0], g[1]], [g[2], g[3]]]);
    const sat2 = satAmFoursomes.flatMap(g => [[g[0], g[2]], [g[1], g[3]]]);
    const sat3 = satAmFoursomes.flatMap(g => [[g[0], g[3]], [g[1], g[2]]]);

    const satpm = makeFourManTeams(usedPairs);
    const sun = makeFourManTeams(usedPairs);

    setSetup({
      fri,
      satam:[
        {name:"Holes 1-6",teams:sat1},
        {name:"Holes 7-12",teams:sat2},
        {name:"Holes 13-18",teams:sat3}
      ],
      satpm,
      sun
    });
  });
}

const tabs=admin?["players","groups","scores","holebyhole","payouts","history","build"]:["groups","scores","payouts","history"];
return <div className="app"><div className="shell"><header className="hero"><div><div className="eyebrow">⛳ Perry Park Golf Trip Commissioner</div><h1>The Perry Park Money Machine</h1><p>Groupings, scoring, hole-by-hole totals, and payout receipts in one clean web app.</p></div><div className="control"><div className="box money"><label>Entry Fee</label><input disabled={!admin} type="number" value={fee} onChange={e=>setFee(e.target.value)}/><strong>Total Pot: {$(pot)}</strong></div><div className="box admin"><strong>{admin?"Admin Mode":"Viewer Mode"}</strong><div className="modes"><button onClick={()=>{if(admin){setTab("groups")}else{setLoginError("Enter password below")}}}>Admin</button><button className="secondary" onClick={()=>{setAdmin(false);setTab("groups");setAdminPassword("");history.replaceState({},"",location.pathname+"?view=viewer")}}>Viewer</button></div>{!admin&&<div className="loginRow"><input type="password" placeholder="Admin password" value={adminPassword} onChange={e=>{setAdminPassword(e.target.value);setLoginError("")}} onKeyDown={e=>{if(e.key==="Enter"){if(adminPassword===ADMIN_PASSWORD){setAdmin(true);setTab("groups");setLoginError("");history.replaceState({},"",location.pathname+"?admin=true")}else{setLoginError("Wrong password")}}}}/><button onClick={()=>{if(adminPassword===ADMIN_PASSWORD){setAdmin(true);setTab("groups");setLoginError("");history.replaceState({},"",location.pathname+"?admin=true")}else{setLoginError("Wrong password")}}}>Unlock</button></div>}{loginError&&<small style={{color:"#fecaca"}}>{loginError}</small>}<button className="secondary" onClick={()=>{navigator.clipboard?.writeText(location.href.split("?")[0]+"?view=viewer");alert("Viewer link copied")}}>Copy Viewer Link</button><small>Viewer link is read-only. Admin changes require the password.</small></div></div></header><nav className="tabs">{tabs.map(t=><button key={t} className={tab===t?"active":""} onClick={()=>setTab(t)}>{t}</button>)}</nav>{tab==="players"&&admin&&<Players players={players} setPlayers={setPlayers}/>} {tab==="groups"&&<Groups players={players} admin={admin} setup={setup} routes={routes} setRoutes={setRoutes} update={update} upseg={upseg} fill={fill} clear={()=>req(()=>setSetup(blank()))} clearScores={clearScores}/>} {tab==="scores"&&<Scores players={players} admin={admin} setup={setup} manual={manual} hs={hs} bounty={bounty} setBounty={setBounty} setM={setM}/>} {tab==="holebyhole"&&admin&&<HoleByHole players={players} setup={setup} routes={routes} hs={hs} setH={setH}/>} {tab==="payouts"&&<Payouts pays={pays} standings={standings} weekendDone={calc.weekendDone} pot={pot} paid={paid} pots={pots}/>} {tab==="history"&&<History players={players} pays={pays} standings={standings} history={history} admin={admin} exportSeason={exportSeason} importSeasonFile={importSeasonFile} exportHistoryCsv={exportHistoryCsv}/>} {tab==="build"&&admin&&<Card><h2>Build Notes</h2><p>Single-file polished version. Admin link: add <code>?admin=true</code>. Viewer link: regular URL or <code>?view=viewer</code>.</p></Card>}</div></div>}
function Players({players,setPlayers}){let upd=(id,f,v)=>setPlayers(p=>p.map(x=>x.id===id?{...x,[f]:f==="name"?v:+v}:x));return <Card><h2>Players & Handicaps</h2><div className="table"><table><thead><tr><th>Name</th><th>Avg</th><th>HCP</th><th>Net Avg</th></tr></thead><tbody>{players.map(p=><tr key={p.id}><td><input value={p.name} onChange={e=>upd(p.id,"name",e.target.value)}/></td><td><input type="number" value={p.avg} onChange={e=>upd(p.id,"avg",e.target.value)}/></td><td><input type="number" value={p.hcp} onChange={e=>upd(p.id,"hcp",e.target.value)}/></td><td>{p.avg-p.hcp}</td></tr>)}</tbody></table></div></Card>}
function Groups({players,admin,setup,routes,setRoutes,update,upseg,fill,clear,clearScores}){return <div className="grid"><Card wide><div className="buttonRow"><button disabled={!admin} onClick={fill}>Generate Balanced Groups</button><button disabled={!admin} className="secondary" onClick={clear}>Clear Groups</button><button disabled={!admin} className="secondary" onClick={clearScores}>Clear Scores</button>{!admin&&<Badge>Viewer mode: locked</Badge>}</div></Card>{rounds.map(r=><Card key={r.id}><h2>{r.title}</h2><p className="muted">{r.type}</p><select disabled={!admin} value={routes[r.id]} onChange={e=>setRoutes(p=>({...p,[r.id]:e.target.value}))}>{R.map(x=><option key={x}>{x}</option>)}</select>{r.groupType==="segments"?setup.satam.map((seg,si)=><div className="section" key={seg.name}><h3>{seg.name}</h3>{seg.teams.map((tm,ti)=><div className="team" key={ti}><div className="teamhead"><Badge>Team {ti+1}</Badge><span>HCP {thcp(players,tm)}</span></div><div className="slots">{tm.map((id,sl)=><SelectP key={sl} disabled={!admin} value={id} players={players} onChange={v=>upseg(si,ti,sl,v)}/>)}</div></div>)}</div>):setup[r.id].map((g,gi)=><div className="team" key={gi}><div className="teamhead"><Badge>{r.groupType==="teams"?"Team":"Foursome"} {gi+1}</Badge><span>HCP {thcp(players,g)}</span></div><div className="slots">{g.map((id,si)=><SelectP key={si} disabled={!admin} value={id} players={players} onChange={v=>update(r.id,gi,si,v)}/>)}</div></div>)}</Card>)}</div>}
function Scores({players,admin,setup,manual,hs,bounty,setBounty,setM}){return <div className="grid"><Card><h2>Friday Own Ball</h2>{players.map(p=>{let ht=sum(hs,`fri-${p.id}`),g=ht.total??manual[`fri-${p.id}`];return <div className="row" key={p.id}><span>{p.name}</span>{admin?<input type="number" placeholder="Manual" value={manual[`fri-${p.id}`]||""} onChange={e=>setM(`fri-${p.id}`,e.target.value)}/>:<span>{g||"-"}</span>}<Badge tone={ht.total!==null?"green":""}>{ht.total!==null?"Hole":"Manual"}</Badge><strong>Net {g?+g-p.hcp:"-"}</strong></div>})}</Card><Card><h2>Saturday AM</h2>{setup.satam.map((seg,si)=><div className="section" key={si}><h3>{seg.name}</h3>{seg.teams.map((ids,ti)=>{let ht=sum(hs,`satam-${si}-${ti}`,6),sc=ht.total??manual[`satam-${si}-${ti}`];return <div className="row" key={ti}><span>{lab(players,ids)}</span>{admin?<input type="number" value={manual[`satam-${si}-${ti}`]||""} onChange={e=>setM(`satam-${si}-${ti}`,e.target.value)}/>:<span>{sc||"-"}</span>}<Badge>{ht.total!==null?"Hole":"Manual"}</Badge><strong>{sc||"-"}</strong></div>})}</div>)}</Card><Card><h2>Saturday PM</h2>{setup.satpm.map((ids,i)=>{let ht=sum(hs,`satpm-${i}`),sc=ht.total??manual[`satpm-${i}`];return <div className="row" key={i}><span>{lab(players,ids)}</span>{admin?<input type="number" value={manual[`satpm-${i}`]||""} onChange={e=>setM(`satpm-${i}`,e.target.value)}/>:<span>{sc||"-"}</span>}<Badge>{ht.total!==null?"Hole":"Manual"}</Badge><strong>{sc||"-"}</strong></div>})}<h3>Bounties</h3>{bounty.map(b=><div className="row" key={b.id}><input disabled={!admin} value={b.label} onChange={e=>setBounty(p=>p.map(x=>x.id===b.id?{...x,label:e.target.value}:x))}/><select disabled={!admin} value={b.winner} onChange={e=>setBounty(p=>p.map(x=>x.id===b.id?{...x,winner:e.target.value}:x))}><option value="">Winner</option>{players.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select><Badge>Auto</Badge><strong>Paid</strong></div>)}</Card><Card><h2>Sunday</h2>{setup.sun.map((ids,i)=>{let ht=sum(hs,`sun-${i}`),sc=ht.total??manual[`sun-${i}`];return <div className="row" key={i}><span>{lab(players,ids)}</span>{admin?<input type="number" value={manual[`sun-${i}`]||""} onChange={e=>setM(`sun-${i}`,e.target.value)}/>:<span>{sc||"-"}</span>}<Badge>{ht.total!==null?"Hole":"Manual"}</Badge><strong>{sc||"-"}</strong></div>})}</Card></div>}
function HoleByHole({players,setup,routes,hs,setH}){return <div className="stack"><Card><h2>Hole-by-Hole Entry</h2><p className="muted">Hole totals override manual scores. Saturday AM is three separate 6-hole games.</p></Card><HoleTable title={`Friday • ${routes.fri}`} holes={holes(routes.fri)} rows={players.map(p=>({key:`fri-${p.id}`,label:p.name,hcp:p.hcp}))} hs={hs} setH={setH} net/>{setup.satam.map((seg,si)=><HoleTable key={si} title={`Sat AM ${seg.name} • ${routes.satam}`} holes={holes(routes.satam).slice(si*6,si*6+6)} rows={seg.teams.map((ids,ti)=>({key:`satam-${si}-${ti}`,label:lab(players,ids)}))} hs={hs} setH={setH} n={6}/>) }<HoleTable title={`Saturday PM • ${routes.satpm}`} holes={holes(routes.satpm)} rows={setup.satpm.map((ids,i)=>({key:`satpm-${i}`,label:lab(players,ids)}))} hs={hs} setH={setH}/><HoleTable title={`Sunday • ${routes.sun}`} holes={holes(routes.sun)} rows={setup.sun.map((ids,i)=>({key:`sun-${i}`,label:lab(players,ids)}))} hs={hs} setH={setH}/></div>}
function HoleTable({title,holes,rows,hs,setH,n=18,net=false}){return <Card><h2>{title}</h2><div className="table"><table className="scorecard"><thead><tr><th>Player / Team</th>{holes.map((h,i)=><th key={i} title={h.label}>{h.overall}</th>)}<th>Total</th>{net&&<th>Net</th>}</tr><tr className="par"><th>Par</th>{holes.map((h,i)=><th key={i}>{h.par}</th>)}<th></th>{net&&<th></th>}</tr><tr className="hcp"><th>HCP</th>{holes.map((h,i)=><th key={i}>{h.hcp}</th>)}<th></th>{net&&<th></th>}</tr></thead><tbody>{rows.map(row=>{let t=sum(hs,row.key,n);return <tr key={row.key}><td>{row.label}</td>{holes.map((_,i)=><td key={i}><input className="tiny" type="number" value={hs[`${row.key}-${i+1}`]||""} onChange={e=>setH(`${row.key}-${i+1}`,e.target.value)}/></td>)}<td><strong>{t.total??"-"}</strong></td>{net&&<td><strong>{t.total!==null?t.total-(row.hcp||0):"-"}</strong></td>}</tr>})}</tbody></table></div></Card>}
function Payouts({pays,standings,weekendDone,pot,paid,pots}){return <div className="grid"><Card wide><h2>Weekend Money Breakdown</h2><p className="muted">Event cash and the overall points race are tracked separately so the leaderboard does not get muddy.</p><div className="audit"><div><span>Friday 18%</span><strong>{$(pots.friday)}</strong></div><div><span>Sat AM 15%</span><strong>{$(pots.satAm)}</strong></div><div><span>Sat PM 27%</span><strong>{$(pots.satPm)}</strong></div><div><span>Sunday 15%</span><strong>{$(pots.sunday)}</strong></div><div><span>Overall 25%</span><strong>{$(pots.overall)}</strong></div></div></Card><Card><h2>Event Cash Earned</h2><p className="muted">Round, segment, scramble, and bounty money only. Overall money is not included here.</p><div className="table"><table><thead><tr><th>Player</th><th>Event Cash</th><th>Details</th></tr></thead><tbody>{pays.map(p=><tr key={p.id}><td>{p.name}</td><td><strong>{$(p.payout)}</strong></td><td>{p.notes.join("; ")||"-"}</td></tr>)}</tbody></table></div></Card><Card><h2>Overall Standings</h2><p className="muted">{weekendDone?"Overall payouts are ready to finalize.":"Projected only until all rounds are scored."}</p><div className="table"><table><thead><tr><th>Rank</th><th>Player</th><th>Pts</th><th>Overall $</th><th>Note</th></tr></thead><tbody>{standings.map((s,i)=><tr key={s.id}><td>{i+1}</td><td>{s.name}</td><td><strong>{s.points}</strong></td><td><strong>{s.projectedOverall?$(s.projectedOverall):"-"}</strong></td><td>{s.overallNote||"-"}</td></tr>)}</tbody></table></div></Card><Card><h2>Pot Audit</h2><div className="audit"><div><span>Collected</span><strong>{$(pot)}</strong></div><div><span>Event cash shown</span><strong>{$(paid)}</strong></div><div><span>Overall pot tracked separately</span><strong>{$(pots.overall)}</strong></div><div><span>Total payout structure</span><strong>{$(pot)}</strong></div></div></Card></div>}

function History({players,pays,standings,history,admin,exportSeason,importSeasonFile,exportHistoryCsv}){const seasons=history.length?history:[];return <div className="grid"><Card wide><h2>History Center</h2><p className="muted">Export this year after the trip, then import that file next year to build a running history. JSON reloads into the app. CSV opens in Excel or Google Sheets.</p><div className="buttonRow"><button disabled={!admin} onClick={exportSeason}>Export This Season JSON</button><button disabled={!admin} className="secondary" onClick={exportHistoryCsv}>Export History CSV</button><label className="badge" style={{cursor:admin?"pointer":"not-allowed",opacity:admin?1:.5}}>Import Season JSON<input disabled={!admin} type="file" accept=".json,application/json" style={{display:"none"}} onChange={importSeasonFile}/></label></div></Card><Card><h2>Current Year Snapshot</h2><div className="historyGrid"><div className="historyStat"><small>Players</small><strong>{players.length}</strong></div><div className="historyStat"><small>Current event cash leader</small><strong>{pays[0]?.name||"-"}</strong></div><div className="historyStat"><small>Overall points leader</small><strong>{standings[0]?.name||"-"}</strong></div></div></Card><Card><h2>Imported Seasons</h2>{seasons.length===0?<p className="muted">No previous seasons imported yet. After this trip, export the season file and save it somewhere safe.</p>:<div className="table"><table><thead><tr><th>Year</th><th>Exported</th><th>Players</th><th>Overall Leader</th></tr></thead><tbody>{seasons.map((s,i)=>{const leader=s.overallStandings?.[0]?.name||"-";return <tr key={i}><td>{s.year||"-"}</td><td>{s.exportedAt?new Date(s.exportedAt).toLocaleDateString():"-"}</td><td>{s.players?.length||0}</td><td>{leader}</td></tr>})}</tbody></table></div>}</Card><Card wide><h2>Historical Player Summary</h2><div className="table"><table><thead><tr><th>Year</th><th>Player</th><th>HCP</th><th>Avg</th><th>Event Cash</th><th>Overall Pts</th><th>Overall $</th></tr></thead><tbody>{(seasons.length?seasons:[{year:"Current",players,eventCash:pays,overallStandings:standings}]).flatMap(s=>(s.players||[]).map(p=>{const cash=(s.eventCash||[]).find(x=>x.id===p.id)?.payout||0;const overall=(s.overallStandings||[]).find(x=>x.id===p.id)||{};return <tr key={(s.year||"Current")+p.id}><td>{s.year||"Current"}</td><td>{p.name}</td><td>{p.hcp}</td><td>{p.avg}</td><td>{$(cash)}</td><td>{overall.points||0}</td><td>{overall.projectedOverall?$(overall.projectedOverall):"-"}</td></tr>}))}</tbody></table></div></Card></div>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
